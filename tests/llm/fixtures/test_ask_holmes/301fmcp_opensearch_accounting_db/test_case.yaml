# MCP variant of 301f_opensearch_accounting_db: same prompt/expected/data, but HolmesGPT queries via the
# TestPulsar MCP server (shared tp-stack) instead of the native elasticsearch toolset.
user_prompt: The accounting service is throwing errors. Investigate the root cause via the 'spans' index in OpenSearch, including any database-level detail.
expected_output:
- Must identify accounting errors with status.message 23505
- Must explain 23505 is a Postgres unique_violation (duplicate key) error
- Should reference the postgresql span / db detail (e.g. attributes.error_type = 23505)
tags:
- opensearch
- traces
- hard
- benchmark
- mcp
setup_timeout: 400
before_test: |
  echo 'Using shared tp-stack: TestPulsar MCP -> OpenSearch Dashboards (spans index, pre-seeded)'
after_test: |
  true

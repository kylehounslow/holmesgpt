# Loki arm of the aggregation comparison ({loki vs opensearch}). The shared dataset
# shared/lvo/datasets/aggregation.json is seeded into Loki; the matched case
# cmp_aggregation_opensearch seeds the SAME records into OpenSearch. Identical prompt +
# expected_output — only the backend + toolset differ. Timestamps re-stamped to ~now at
# load so time-windowed queries hit data regardless of when the benchmark runs.
user_prompt: "In namespace cmp-aggregation-loki, which service produced the most errors recently, and what are the distinct payment gateway error codes (of the form ERR-XXXX) in those errors?"

expected_output:
  - "Must identify payments-worker as the service with the most errors"
  - "Must list the distinct payment-gateway error codes: ERR-5521, ERR-8830, ERR-3074"

tags:
  - logs
  - kubernetes
  - loki
  - comparison
  - hard

setup_timeout: 400

port_forwards:
  - namespace: cmp-aggregation-loki
    service: loki
    local_port: 3123
    remote_port: 3100

before_test: |
  source ../../shared/lvo/lvo_test_utils.sh
  lvo_deploy_loki "cmp-aggregation-loki"
  lvo_seed_loki "cmp-aggregation-loki" "aggregation"
  echo "✅ Seeded aggregation into Loki (cmp-aggregation-loki)"

after_test: |
  kubectl delete namespace cmp-aggregation-loki --wait=false || true

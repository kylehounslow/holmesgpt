# Ported from our-harness cases-rca-benchmark-v1.json. Trace RCA over a static deterministic OTel-span dataset (shared/otel_spans.ndjson) seeded into a shared 'spans' index. Real signatures harvested from the OpenSearch playground (our-harness/opensearch-port/GROUND_TRUTH.md); playground not in runtime path.
user_prompt: The accounting service is throwing errors. Investigate the root cause via the 'spans' index in OpenSearch, including any database-level detail.
expected_output:
- Must identify accounting errors with status.message 23505
- Must explain 23505 is a Postgres unique_violation (duplicate key) error
- Should reference the postgresql span / db detail (e.g. attributes.error_type = 23505)
tags:
- opensearch
- traces
- hard
- benchmark
setup_timeout: 400
port_forwards:
- namespace: app-301f
  service: opensearch
  local_port: 9316
  remote_port: 9200
before_test: |
  source ../../shared/opensearch_test_utils.sh
  os_setup "app-301f"
  os_load_spans "spans"
  os_assert_count "spans" '{"query":{"term":{"status.code":2}}}' 485
  echo "Loaded shared OTel span dataset into spans (485 error spans)"
after_test: |
  kubectl delete namespace app-301f || true

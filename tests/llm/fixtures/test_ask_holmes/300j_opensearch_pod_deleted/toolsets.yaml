# OpenSearch via the elasticsearch toolset, in-cluster backend over port-forward.
# kubernetes/core stays enabled so the agent CAN try (and find the pod gone);
# kubernetes/logs disabled so it must use the index.
toolsets:
  kubernetes/logs:
    enabled: false
  elasticsearch/data:
    enabled: true
    config:
      api_url: "http://localhost:9309"
  elasticsearch/cluster:
    enabled: true
    config:
      api_url: "http://localhost:9309"

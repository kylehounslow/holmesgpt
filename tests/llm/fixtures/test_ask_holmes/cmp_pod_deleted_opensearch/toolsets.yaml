# OpenSearch arm of the pod_deleted comparison. Same dataset as cmp_pod_deleted_loki,
# queried through the elasticsearch toolset (DSL/PPL) against the in-cluster backend
# over the harness port-forward. Security disabled, so no auth.
toolsets:
  kubernetes/logs:
    enabled: false
  kubernetes/core:
    enabled: true
  elasticsearch/data:
    enabled: true
    config:
      api_url: "http://localhost:9321"
  elasticsearch/cluster:
    enabled: true
    config:
      api_url: "http://localhost:9321"

# OpenSearch arm of the pod_deleted comparison ({loki vs opensearch}). The shared dataset
# shared/lvo/datasets/pod_deleted.json is seeded into OpenSearch; the matched case
# cmp_pod_deleted_loki seeds the SAME records into Loki. Identical prompt + expected_output
# — only the backend + toolset differ. Timestamps re-stamped to ~now at load.
user_prompt: "The payment-api pod in namespace cmp-pod-deleted-opensearch had issues recently, but the pod no longer exists. Investigate what happened and identify the root cause."

expected_output:
  - "Must identify that payment-api failed due to database connection pool exhaustion"
  - "Must reference evidence from the indexed/stored logs (the pool-exhausted / could-not-acquire-connection errors)"
  - "Must rely on the logging backend, since the pod is gone and kubectl logs is not a usable source"

tags:
  - logs
  - kubernetes
  - opensearch
  - comparison
  - medium

setup_timeout: 400

port_forwards:
  - namespace: cmp-pod-deleted-opensearch
    service: opensearch
    local_port: 9321
    remote_port: 9200

before_test: |
  source ../../shared/lvo/lvo_test_utils.sh
  lvo_deploy_opensearch "cmp-pod-deleted-opensearch"
  # Pod-deleted scenario: stand up a payment-api-0 pod, then delete it, so the
  # agent cannot kubectl-logs it and must rely on the logging backend.
  kubectl run payment-api-0 --image=busybox:1.36 -n cmp-pod-deleted-opensearch --restart=Never \
    --command -- sh -c 'echo started; sleep 3600' 2>/dev/null || true
  kubectl wait --for=condition=ready pod/payment-api-0 -n cmp-pod-deleted-opensearch --timeout=60s 2>/dev/null || true
  kubectl delete pod payment-api-0 -n cmp-pod-deleted-opensearch --wait=true --timeout=60s 2>/dev/null || true

  lvo_seed_opensearch "cmp-pod-deleted-opensearch" "pod_deleted" "cmp-pod-deleted-logs"
  echo "✅ Seeded pod_deleted into OpenSearch (cmp-pod-deleted-opensearch/cmp-pod-deleted-logs)"

after_test: |
  kubectl delete namespace cmp-pod-deleted-opensearch --wait=false || true

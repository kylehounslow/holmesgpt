# Ported from our-harness cases-rca-benchmark-v1.json. Trace RCA over a static deterministic OTel-span dataset (shared/otel_spans.ndjson) seeded into a shared 'spans' index. Real signatures harvested from the OpenSearch playground (our-harness/opensearch-port/GROUND_TRUTH.md); playground not in runtime path.
user_prompt: Checkout is failing for some orders. Using the 'spans' index in OpenSearch, trace the failure to its origin service and explain the chain.
expected_output:
- 'Must identify checkout failures: failed to prepare order: failed to get product #"OLJCESPC7Z"'
- 'Must trace the root cause to product-catalog (the ''Error: Product Catalog Fail Feature Flag Enabled'' feature flag)'
- Must explain that checkout fails because product-catalog fails upstream
tags:
- opensearch
- traces
- medium
- benchmark
setup_timeout: 400
port_forwards:
- namespace: app-301c
  service: opensearch
  local_port: 9313
  remote_port: 9200
before_test: |
  source ../../shared/opensearch_test_utils.sh
  os_setup "app-301c"
  os_load_spans "spans"
  os_assert_count "spans" '{"query":{"term":{"status.code":2}}}' 485
  echo "Loaded shared OTel span dataset into spans (485 error spans)"
after_test: |
  kubectl delete namespace app-301c || true

# Ported from our-harness cases-rca-benchmark-v1.json. Trace RCA over a static deterministic OTel-span dataset (shared/otel_spans.ndjson) seeded into a shared 'otel-v1-apm-span-bench' index. Real signatures harvested from the OpenSearch playground (our-harness/opensearch-port/GROUND_TRUTH.md); playground not in runtime path.
user_prompt: The weather-agent is returning errors. Using the 'otel-v1-apm-span-bench' index in OpenSearch, find what is failing and why.
expected_output:
- 'Must identify the weather-agent error: Tool ''get_current_weather'' failed: External API returned 503'
- Must explain it is an external weather API returning 503 (an upstream/external dependency failure)
tags:
- opensearch
- traces
- medium
- benchmark
setup_timeout: 400
port_forwards:
- namespace: app-301d
  service: opensearch
  local_port: 9314
  remote_port: 9200
before_test: |
  source ../../shared/opensearch_test_utils.sh
  os_setup "app-301d"
  os_load_spans "otel-v1-apm-span-bench"
  os_assert_count "otel-v1-apm-span-bench" '{"query":{"term":{"status.code":2}}}' 485
  echo "Loaded shared OTel span dataset into spans (485 error spans)"
after_test: |
  kubectl delete namespace app-301d || true
